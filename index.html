
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mapa Cultural de Avaré</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }
    header {
      padding: 25px;
      border-bottom: 5px solid #009b3a;
    }
    .logo {
      border: 1px dashed #999;
      padding: 15px;
      display: inline-block;
    }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
      min-height: 60vh;
    }
    input {
      padding: 13px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }
    .tag {
      background: #ffdf00;
      padding: 5px 9px;
      border-radius: 15px;
      display: inline-block;
      margin: 3px;
      font-size: 12px;
    }
    footer {
      background: #002776;
      color: white;
      padding: 25px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">LOGO DA PREFEITURA</div>
    <h1>Mapa Cultural de Avaré</h1>
    <p>Conheça os artistas da nossa cidade</p>
  </header>

  <main>
    <h2>Encontre talentos avareenses</h2>
    <input id="busca"
      placeholder="Pesquisar artistas ou áreas culturais">

    <p id="mensagem">Preparando catálogo...</p>
    <div id="artistas" class="grid"></div>
  </main>

  <footer>A cultura não para!</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL_SUPABASE =
      "https://eggtmdibvcixlnlnlhcf.supabase.co";

    const CHAVE_PUBLICA = "sb_publishable_TVfmy-GC9F-5z2aLogQ0Gg_dnsfHRFK";

    const area = document.getElementById("artistas");
    const mensagem = document.getElementById("mensagem");
    let artistas = [];

    function desenhar() {
      const busca = document.getElementById("busca")
        .value.toLowerCase();

      area.replaceChildren();

      const filtrados = artistas.filter(a =>
        (a.nome_artistico + " " +
        (a.areas_atuacao || []).join(" "))
        .toLowerCase().includes(busca)
      );

      mensagem.textContent =
        filtrados.length + " artista(s) encontrado(s).";

      filtrados.forEach(a => {
        const card = document.createElement("article");
        card.className = "card";

        const titulo = document.createElement("h3");
        titulo.textContent = a.nome_artistico;
        card.appendChild(titulo);

        const bio = document.createElement("p");
        bio.textContent = a.biografia || "";
        card.appendChild(bio);

        (a.areas_atuacao || []).forEach(area => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = area;
          card.appendChild(tag);
        });

        area.appendChild(card);
      });
    }

    async function carregar() {
      if (!CHAVE_PUBLICA) {
        mensagem.textContent =
          "Catálogo aguardando conexão com o Supabase.";
        return;
      }

      const banco = window.supabase.createClient(
        URL_SUPABASE, CHAVE_PUBLICA
      );

      const { data, error } = await banco
        .from("artistas_publicos")
        .select("*");

      if (error) {
        mensagem.textContent =
          "Erro ao carregar catálogo: " + error.message;
        return;
      }

      artistas = data || [];
      desenhar();
    }

    document.getElementById("busca")
      .addEventListener("input", desenhar);

    carregar();
  </script>
</body>
</html>
