<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conheça os artistas e as expressões culturais de Avaré.">
  <title>Mapa Cultural de Avaré</title><link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script><script defer src="catalogo.js"></script>
</head>
<body>
  <header><div class="wrap">
    <nav aria-label="Navegação principal"><span class="eyebrow">Cultura de Avaré</span><a href="equipe.html">Área da equipe</a></nav>
    <h1>Mapa Cultural de Avaré</h1><p>Conheça os artistas e os talentos da nossa cidade.</p>
  </div></header>
  <main class="wrap">
    <section class="panel" aria-labelledby="titulo-busca">
      <h2 id="titulo-busca">Encontre talentos avareenses</h2><label for="busca">Nome artístico ou área cultural</label>
      <input id="busca" type="search" placeholder="Ex.: música, teatro, artesanato" disabled>
      <p id="mensagem" class="status" role="status" aria-live="polite">Carregando catálogo…</p>
      <button id="tentar" class="secondary" type="button" hidden>Tentar novamente</button>
    </section>
    <section id="artistas" class="grid" aria-label="Artistas cadastrados"></section>
  </main>
  <footer><div class="wrap">A cultura não para! · Mapa Cultural de Avaré</div></footer>
</body>
</html>
